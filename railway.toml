# Railway production (Nginx + PHP-FPM). See scripts/railway-entrypoint.sh
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# لا تمسح الكاش هنا — الإقلاع يبني config/route/view cache.
# لا تضع startCommand (php -S / npm) — ENTRYPOINT يشغّل Nginx+FPM.
preDeployCommand = "bash -lc \"php artisan migrate --force || true; php artisan system:set-super-admins || true\""
restartPolicyType = "ON_FAILURE"
healthcheckPath = "/up"
healthcheckTimeout = 30
