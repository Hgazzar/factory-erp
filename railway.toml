# إعدادات Railway (انظر: https://docs.railway.com/reference/config-as-code)
#
# preDeployCommand: لا تستخدم && الصارم على أوامر غير حرجة — فشلها يوقف الـDeploy بالكامل.
# Docker ENTRYPOINT يمسح الكاش عند كل إقلاع ويشغّل السيرفر بـ public/index.php كـ router.
[deploy]
preDeployCommand = "bash -lc \"php artisan optimize:clear || true; php artisan migrate --force; php artisan system:set-super-admins || true\""
