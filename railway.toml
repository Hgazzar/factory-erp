# إعدادات Railway (انظر: https://docs.railway.com/reference/config-as-code)
#
# مهم: المفتاح الصحيح لأوامر ما قبل التشغيل هو preDeployCommand وليس releaseCommand.
#
# Docker: ENTRYPOINT (scripts/railway-entrypoint.sh) يشغّل optimize:clear عند كل إقلاع.
# preDeployCommand يمسح الكاش أيضاً قبل تبديل النسخة الحية.
[deploy]
preDeployCommand = "bash -lc \"php artisan optimize:clear && php artisan migrate --force && php artisan system:set-super-admins\""
# مع Dockerfile + ENTRYPOINT: اترك startCommand فارغاً أو علّقه حتى لا يستبدل إقلاع الحاوية.
# startCommand = "php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
